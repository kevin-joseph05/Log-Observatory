[project]
name = "nasa-web-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-athena-community>=1.11.0",
    "duckdb>=1.5.4",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "notebook>=7.5.7",
    "psutil>=7.2.2",
    "pyspark==3.5.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.11", "mypy>=1.15", "pytest>=8.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = [".venv/", "notebooks/"]
